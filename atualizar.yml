name: Atualizar dados de mercado
on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python robo/atualizar.py
      - name: Salvar resultado
        run: |
          git config user.name "robo-carteira"
          git config user.email "robo@users.noreply.github.com"
          git add data/mercado.json
          git diff --cached --quiet || (git commit -m "Atualiza dados de mercado" && git push)
